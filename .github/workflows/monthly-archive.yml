name: Monthly Archive to Releases

on:
  schedule:
    # 1st of each month, 01:30 UTC: archive the previous month.
    # (cron cannot express "last day of month" — months have 28–31 days —
    # so we archive on the 1st instead, after backfilling the tail days.)
    - cron: "30 1 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to archive, YYYY-MM (blank = previous month)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Backfill the tail of the month (fetch last 8 days)
        run: python3 bing_wallpaper.py 8 -o pics

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Refresh gallery & latest.jpg
        run: |
          python3 make_gallery.py
          latest=$(find pics -type f -name '*.jpg' | sort | tail -n 1)
          cp "$latest" latest.jpg

      - name: Commit any backfilled images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pics latest.jpg thumbs README.md
          if git diff --cached --quiet; then
            echo "No new images"
          else
            git commit -m "Backfill images before monthly archive"
            git push
          fi

      - name: Zip the month and publish a Release
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            TARGET="${{ inputs.month }}"
          else
            TARGET=$(date -u -d "last month" +%Y-%m)
          fi
          KEY=$(echo "$TARGET" | tr -d '-')
          shopt -s nullglob
          files=( pics/${TARGET}/*.jpg pics/${KEY}*.jpg )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No images for $TARGET, skipping"
            exit 0
          fi
          zip -j "bing-wallpapers-${TARGET}.zip" "${files[@]}"
          ls -lh "bing-wallpapers-${TARGET}.zip"
          title=$(date -u -d "${TARGET}-01" +"%B %Y")
          if gh release view "$TARGET" >/dev/null 2>&1; then
            gh release upload "$TARGET" "bing-wallpapers-${TARGET}.zip" --clobber
          else
            gh release create "$TARGET" "bing-wallpapers-${TARGET}.zip" \
              --title "${title} Wallpapers (${#files[@]} images)" \
              --notes "All Bing daily wallpapers for ${title}: ${#files[@]} images, 4K UHD (1080p fallback). The same files are also browsable in the pics/${TARGET}/ folder."
          fi
